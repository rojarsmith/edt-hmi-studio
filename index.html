    <style>
      /* Splash screen — inline so it paints before any bundle loads.
         Shared by web and the desktop shell (both serve this same file). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        opacity: 1;
        transition: opacity 0.28s ease-out;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 132px;
        height: auto;
      }
      .splash-title {
        margin-top: 20px;
        font-size: 21px;
        font-weight: 600;
        color: #30363b;
        letter-spacing: 0.16em;
        padding-left: 0.16em; /* re-center: offsets the trailing letter-spacing */
      }
      .splash-loader {
        margin-top: 30px;
      }
      .splash-loader .shape {
        fill: none;
        stroke: #285838;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 100;
        animation: splash-draw 2.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      .splash-loader .shape:nth-child(2) { animation-delay: 0.15s; }
      .splash-loader .shape:nth-child(3) { animation-delay: 0.3s; }
      .splash-loader .shape:nth-child(4) { animation-delay: 0.45s; }
      @keyframes splash-draw {
        0%        { stroke-dashoffset: 100; opacity: 0.2; }
        45%, 60%  { stroke-dashoffset: 0;   opacity: 1; }
        100%      { stroke-dashoffset: -100; opacity: 0.2; }
      }
      .splash-version {
        position: absolute;
        bottom: 26px;
        font-size: 12px;
        color: #8b9298;
        letter-spacing: 0.08em;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-loader .shape {
          animation: none;
          stroke-dashoffset: 0;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
