<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>EDT HMI Studio</title>
  <!-- display panel -->
  <rect x="8.5" y="18.5" width="79" height="59" rx="10" fill="none" stroke="#285838" stroke-width="5"/>
  <!-- gauge widget: arc open at the bottom, needle pointing up-right -->
  <path d="M24.5 57.5 A12 12 0 1 1 41.5 57.5" fill="none" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <line x1="33" y1="49" x2="39.4" y2="42.6" stroke="#4f9d68" stroke-width="4" stroke-linecap="round"/>
  <circle cx="33" cy="49" r="2.6" fill="#285838"/>
  <!-- slider widgets: tracks with offset knobs -->
  <line x1="52" y1="40" x2="76" y2="40" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <circle cx="68" cy="40" r="4.6" fill="#4f9d68"/>
  <line x1="52" y1="56" x2="76" y2="56" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <circle cx="58" cy="56" r="4.6" fill="#4f9d68"/>
</svg>
