body{margin:0;font-family:system-ui,sans-serif}
.panel{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
.light{background:#f5f5f5;color:#30363b}.dark{background:#1d2126;color:#e8ecef}
.rowline{display:flex;align-items:flex-end;gap:30px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#8b9298}
.cell svg{display:block;width:100%;height:100%}
h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;opacity:.6}
.lockup{display:flex;align-items:center;gap:13px}
.lockup .mark{width:42px;height:42px}.lockup .mark svg{display:block;width:100%;height:100%}
.lockup .name{font-size:21px;font-weight:600;letter-spacing:0.13em}
