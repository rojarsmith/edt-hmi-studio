<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>EDT HMI Studio (green)</title>
  <!-- square panel -->
  <rect x="10" y="10" width="76" height="76" rx="16" fill="none" stroke="#285838" stroke-width="5"/>
  <!-- gauge: arc open at the bottom, needle up-right -->
  <path d="M24.5 48.5 A12 12 0 1 1 41.5 48.5" fill="none" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <line x1="33" y1="40" x2="39.4" y2="33.6" stroke="#4f9d68" stroke-width="4" stroke-linecap="round"/>
  <circle cx="33" cy="40" r="2.6" fill="#285838"/>
  <!-- vertical slider on the right -->
  <line x1="66" y1="27" x2="66" y2="53" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <circle cx="66" cy="35" r="4.6" fill="#4f9d68"/>
  <!-- horizontal slider across the bottom -->
  <line x1="24" y1="66" x2="72" y2="66" stroke="#285838" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="66" r="4.6" fill="#4f9d68"/>
</svg>
