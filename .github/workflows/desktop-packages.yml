name: Build desktop packages

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
            framework: net10.0
            archive_name: edt-hmi-studio-desktop-linux
          - runner: windows-latest
            os_name: windows
            framework: net10.0-windows
            archive_name: edt-hmi-studio-desktop-windows
          - runner: macos-latest
            os_name: macos
            framework: net10.0
            archive_name: edt-hmi-studio-desktop-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install web dependencies
        run: npm ci

      - name: Build desktop web assets
        run: npm run build:desktop-web

      - name: Publish desktop host
        run: dotnet publish ./desktop/EdtHmiStudio.Desktop.csproj -c Release -f ${{ matrix.framework }} -o ./artifacts/${{ matrix.archive_name }}

      - name: Create zip artifact
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ${{ matrix.archive_name }}.zip
          directory: ./artifacts
          path: ${{ matrix.archive_name }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ./artifacts/${{ matrix.archive_name }}.zip
